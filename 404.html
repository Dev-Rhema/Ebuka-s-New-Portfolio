<!doctype html>
<html lang="en" class="h-full overflow-hidden overscroll-none">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta name="robots" content="noindex" />
    <title>Page not found · Ebuka's Portfolio</title>
    <!-- The page is text until the game loads, so fetch its fonts alongside the scripts. -->
    <link
      rel="preload"
      href="/src/assets/fonts/DMSerifDisplay-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/Geist-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/GeistMono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body class="h-full overflow-hidden overscroll-none bg-white">
    <main
      id="ride"
      class="group relative h-svh touch-none overflow-hidden text-center select-none unit-440 md:unit-fit-svh"
    >
      <canvas
        data-game
        class="absolute bottom-0 left-0 h-302 w-full md:h-680"
      ></canvas>

      <a
        href="/"
        aria-label="Home"
        data-margin
        class="absolute top-32.5 left-24 md:top-34.5 md:left-80"
      >
        <img src="/logo.svg" alt="" class="h-34 w-31 invert md:h-44 md:w-40" />
      </a>
      <a
        href="/"
        class="absolute top-32 right-24 flex h-32 w-112 items-center justify-center bg-black font-['Geist'] text-14 font-medium tracking-[-0.04em] text-white md:right-80 md:h-46 md:w-144 md:text-16"
      >
        Home
      </a>

      <div data-intro class="relative pt-98 md:pt-170">
        <h1
          data-title
          class="font-['DM-Serif'] text-32 leading-none tracking-[-0.02em] text-black md:text-56"
        >
          You have strayed, warlock
        </h1>
        <p
          data-subtitle
          class="mx-auto mt-20 max-w-262 font-['Geist'] text-16 leading-16.25 font-medium tracking-[-0.02em] text-[#8a8a8a] md:mt-25 md:max-w-640 md:text-28 md:leading-28"
        >
          That which you seek is not here. Go Home, or en garde if your valor is
          as legends say
        </p>
        <div class="mt-28 flex items-center justify-center gap-16 md:mt-56">
          <span
            class="flex size-36 shrink-0 pointer-coarse:hidden rounded-8 bg-[#4A4A4A] text-white shadow-button inset-shadow-bevel"
          >
            <svg viewBox="0 0 36 36" fill="none" class="size-full">
              <path
                d="M12 15.67V18.33A1 1 0 0 0 13 19.33H23A1 1 0 0 0 24 18.33V15.67"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
          </span>
          <span
            data-hint
            role="status"
            class="font-['Geist-Mono'] text-16 leading-none tracking-[0.1em] text-[#8a8a8a]"
            >Press Spacebar to test yourself</span
          >
        </div>
        <form
          data-save
          hidden
          class="mx-auto mt-24 flex w-fit flex-col items-center md:mt-40"
        >
          <div class="flex items-center gap-8">
            <label
              for="player-name"
              class="font-['Geist-Mono'] text-14 leading-none tracking-[0.1em] text-[#8a8a8a] md:text-16"
              >Your name</label
            >
            <input
              id="player-name"
              name="name"
              maxlength="24"
              class="h-32 w-176 border border-[#d8d8d8] bg-white px-12 font-['Geist'] text-14 font-medium tracking-[-0.04em] text-[#404040] outline-none focus:border-black md:h-46 md:w-240 md:text-16"
            />
            <button
              type="submit"
              disabled
              class="flex h-32 w-112 items-center justify-center bg-black font-['Geist'] text-14 font-medium tracking-[-0.04em] text-white disabled:opacity-40 md:h-46 md:w-144 md:text-16"
            ></button>
          </div>
          <p
            data-save-error
            role="alert"
            class="mt-12 font-['Geist-Mono'] text-14 leading-none tracking-[0.1em] text-[#b42318] empty:hidden md:text-16"
          ></p>
        </form>
        <button
          type="button"
          data-open-leaders
          data-over-leaders
          hidden
          class="mx-auto mt-24 block pb-2 font-['Geist-Mono'] text-16 leading-none tracking-[0.1em] text-[#8a8a8a] underline-dashes md:hidden"
        >
          View Leaderboard
        </button>
      </div>

      <div data-board class="invisible">
        <div class="absolute top-118 right-80 hidden w-271 text-left md:block">
          <h2
            class="font-['DM-Serif'] text-16 leading-none tracking-[-0.02em] text-[#8a8a8a] md:text-21"
          >
            Legends Unnamed
          </h2>
          <ol data-leaders class="mt-6"></ol>
        </div>
      </div>

      <div data-hud class="invisible">
        <div class="absolute top-98 left-24 text-left md:top-118.5 md:left-80">
          <p
            data-score
            class="font-['Geist'] text-24 leading-none font-medium tabular-nums text-[#404040] md:text-30"
          >
            0000
          </p>
          <p
            data-best
            class="mt-14 font-['Geist-Mono'] text-14 leading-none tracking-[0.1em] text-[#8a8a8a] md:mt-12 md:text-16"
          ></p>
        </div>
        <button
          type="button"
          data-open-leaders
          class="absolute top-95 right-24 pb-2 font-['Geist-Mono'] text-16 leading-none tracking-[0.1em] text-[#8a8a8a] underline-dashes md:hidden"
        >
          View Leaderboard
        </button>
      </div>

      <dialog
        data-sheet
        aria-label="Legends Unnamed Leaderboard"
        class="fixed inset-x-24 top-auto bottom-24 m-0 w-auto max-w-none rounded-16 bg-white text-left backdrop:bg-black/20 md:hidden"
      >
        <div class="relative p-16">
          <h2
            class="font-['DM-Serif'] text-16 leading-none tracking-[-0.02em] text-[#8a8a8a]"
          >
            Legends Unnamed Leaderboard
          </h2>
          <button
            type="button"
            data-close
            aria-label="Close leaderboard"
            class="absolute top-8.75 right-8.75 flex size-32 items-center justify-center text-black"
          >
            <svg viewBox="0 0 12 12" fill="none" class="size-12">
              <path
                d="M1 1 11 11M11 1 1 11"
                stroke="currentColor"
                stroke-width="1.4"
              />
            </svg>
          </button>
          <ol data-sheet-leaders></ol>
        </div>
      </dialog>

      <div
        role="status"
        class="invisible absolute top-219 right-36 left-36 flex flex-col items-center opacity-0 transition-[opacity,visibility] duration-300 group-data-checkpoint:visible group-data-checkpoint:opacity-100 md:top-auto md:right-80 md:bottom-496.5 md:left-80"
      >
        <h2
          class="font-['DM-Serif'] text-24 leading-none tracking-[-0.02em] text-black md:text-56"
        >
          Checkpoint reached
        </h2>
        <p
          class="mt-13.5 font-['Geist'] text-16 leading-16.25 font-medium tracking-[-0.02em] text-[#8a8a8a] md:mt-25 md:text-28 md:leading-28"
        >
          Onwards, warlock
        </p>
        <div
          class="relative mt-39 flex w-full flex-col items-center md:mt-50 md:flex-row md:justify-center"
        >
          <div
            aria-live="off"
            class="order-last mt-40 text-center md:absolute md:top-1/2 md:left-0 md:order-none md:mt-0 md:-translate-y-1/2 md:text-left"
          >
            <p
              class="font-['Geist'] text-21 leading-none font-medium tracking-[-0.04em] text-[#404040] md:text-24"
            >
              Barrier of Faith Active
            </p>
            <p
              data-expires
              class="mt-15 font-['Geist-Mono'] text-14 leading-none tracking-[0.1em] text-[#8a8a8a] md:mt-12 md:text-16"
            ></p>
          </div>
          <div
            data-banner
            class="relative w-full max-w-478 pt-6 pb-7.5 md:pt-17 md:pb-18.5"
          >
            <div
              class="relative bg-[#ebebeb] py-6.5 pr-6 pl-8 md:py-8 md:pr-5 md:pl-19"
            >
              <span
                class="absolute top-0 left-[25.3%] h-6.5 w-6 -translate-x-1/2 bg-white [clip-path:polygon(0_0,100%_0,50%_100%)] md:left-[27.3%] md:h-8 md:w-9"
              ></span>
              <span
                class="absolute top-0 left-[66.4%] h-6.5 w-6 -translate-x-1/2 bg-white [clip-path:polygon(0_0,100%_0,50%_100%)] md:left-[67.3%] md:h-8 md:w-9"
              ></span>
              <span
                class="absolute top-0 left-[94.9%] h-6.5 w-6 -translate-x-1/2 bg-white [clip-path:polygon(0_0,100%_0,50%_100%)] md:left-[95.5%] md:h-8 md:w-9"
              ></span>
              <span
                class="absolute bottom-0 left-[16.2%] hidden h-8 w-9 -translate-x-1/2 bg-white md:block [clip-path:polygon(50%_0,100%_100%,0_100%)]"
              ></span>
              <span
                class="absolute bottom-0 left-[86.3%] hidden h-8 w-9 -translate-x-1/2 bg-white md:block [clip-path:polygon(50%_0,100%_100%,0_100%)]"
              ></span>
              <p
                data-fact
                class="bg-white px-12 py-3.5 font-['Geist-Mono'] text-14 leading-20 tracking-[0.1em] text-balance text-[#8a8a8a] md:py-6 md:text-16 md:leading-22"
              ></p>
            </div>
            <span
              class="absolute top-0 bottom-0 left-0 w-8 rounded-full bg-[#4c4c4c] md:w-12"
            ></span>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/notFound/main.js"></script>
  </body>
</html>
