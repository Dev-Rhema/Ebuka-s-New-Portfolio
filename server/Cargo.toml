[package]
name = "server"
version = "0.1.0"
edition = "2024"

# The library (db + scoring rules) is shared with the Vercel function in ../api.
# The `local` feature adds SQLite-file support, which compiles SQLite from C. The
# Vercel function only talks to Turso over HTTPS, so it turns this feature off.
[features]
default = ["local"]
local = ["libsql/core"]

[[bin]]
name = "server"
path = "src/main.rs"
required-features = ["local"]

[dependencies]
anyhow = "1.0.104"
libsql = { version = "0.10.0", default-features = false, features = ["remote", "tls"] }
maplit = "1.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
