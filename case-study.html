<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case study · Ebuka's Portfolio</title>

      name="description"
      content="Ebuka Chidube is a senior digital marketer who turns marketing spend into customer acquisition and revenue, with 7+ years of paid media for brands like Piggyvest, SendSprint and DANG."

    <link
      rel="preload"
      href="/src/assets/fonts/Geist-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Link previews: crawlers don't run JavaScript, so these are shared by every case study. -->
    <meta property="og:title" content="Case study · Ebuka's Portfolio" />
    <meta property="og:type" content="article" />
    <meta property="og:image" content="https://ebuka.marketing/Meta.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="Ebuka Chidube, Senior Digital Marketer"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ebuka.marketing/Meta.jpg" />
  </head>
