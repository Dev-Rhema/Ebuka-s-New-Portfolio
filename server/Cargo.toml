[package]
name = "server"
version = "0.1.0"
edition = "2024"
# This folder is deployed as its own Vercel project (Root Directory: server) with the
# Rust preset. Vercel runs `src/main.rs` as a standalone HTTP server, passing the port
# in the PORT environment variable. Don't add a `vercel_runtime` dependency: Vercel
# switches to a different mode when it sees one, and this server would stop working.
#
# The `local` feature adds SQLite-file support for local development.
[features]
default = ["local"]
local = ["libsql/core"]

[[bin]]
name = "server"
path = "src/main.rs"
required-features = ["local"]

[dependencies]
anyhow = "1.0.104"
libsql = { version = "0.10.0", default-features = false, features = ["remote", "tls"] }
maplit = "1.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
