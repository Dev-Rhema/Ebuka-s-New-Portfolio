# Vercel Functions written in Rust. Vercel requires this file at the project root and
# builds each [[bin]] below into one function, served at the matching /api path.
[package]
name = "portfolio-api"
version = "0.1.0"
edition = "2024"
publish = false
# The root `src/` folder belongs to the Vite app, so don't let Cargo look for Rust targets in it.
autobins = false
autoexamples = false
autotests = false
autobenches = false

[features]
# For running the function locally against a SQLite file: cargo run --bin scores --features local
local = ["server/local"]

[dependencies]
# The shared database code and leaderboard rules. Turso only, no C SQLite build.
server = { path = "server", default-features = false }
vercel_runtime = "2.4.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
http-body-util = "0.1"
serde_json = "1"
anyhow = "1"

[[bin]]
name = "scores"
path = "api/scores.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
