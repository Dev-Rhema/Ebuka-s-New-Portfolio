<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Ebuka's Portfolio</title>
  </head>
  <body class="bg-white">
    <main
      id="ride"
      class="relative h-svh touch-manipulation overflow-hidden text-center select-none [--u:min(calc(100vw/1440),calc(100svh/900))]"
    >
      <canvas
        data-game
        class="absolute bottom-0 left-0 h-[calc(var(--u)*680)] w-full"
      ></canvas>

      <a
        href="/"
        aria-label="Home"
        class="absolute top-[calc(var(--u)*34.5)] left-[calc(var(--u)*80)]"
      >
        <img
          src="/logo.svg"
          alt=""
          class="h-[calc(var(--u)*44)] w-[calc(var(--u)*40)] invert"
        />
      </a>
      <a
        href="/"
        class="absolute top-[calc(var(--u)*32)] right-[calc(var(--u)*80)] flex h-[calc(var(--u)*46)] w-[calc(var(--u)*144)] items-center justify-center bg-black font-['Geist'] text-[calc(var(--u)*16)] font-medium tracking-[-0.04em] text-white"
      >
        Home
      </a>

      <div class="relative pt-[calc(var(--u)*170)]">
        <h1
          class="font-['DM-Serif'] text-[calc(var(--u)*56)] leading-none tracking-[-0.02em] text-black"
        >
          You have strayed, warlock
        </h1>
        <p
          class="mx-auto mt-[calc(var(--u)*25)] max-w-[calc(var(--u)*640)] font-['Geist'] text-[calc(var(--u)*28)] leading-[calc(var(--u)*28)] font-medium tracking-[-0.02em] text-[#8a8a8a]"
        >
          That which you seek is not here. Go Home, or en garde if your valor is
          as legends say
        </p>
        <div
          data-prompt
          class="mt-[calc(var(--u)*56)] flex items-center justify-center gap-[calc(var(--u)*16)]"
        >
          <span
            class="flex size-[calc(var(--u)*36)] shrink-0 rounded-[calc(var(--u)*8)] bg-[#4A4A4A] text-white shadow-[0_calc(var(--u)*10.28)_calc(var(--u)*10.5)_rgba(0,0,0,0.19),0_calc(var(--u)*28.42)_calc(var(--u)*29.05)_rgba(0,0,0,0.27),0_calc(var(--u)*68.43)_calc(var(--u)*69.94)_rgba(0,0,0,0.35),0_calc(var(--u)*227)_calc(var(--u)*232)_rgba(0,0,0,0.54),inset_0_calc(var(--u)*-3)_calc(var(--u)*2)_rgba(0,0,0,0.25),inset_0_calc(var(--u)*2)_calc(var(--u)*2)_rgba(179,179,179,0.25)]"
          >
            <svg viewBox="0 0 36 36" fill="none" class="size-full">
              <path
                d="M12 15.67V18.33A1 1 0 0 0 13 19.33H23A1 1 0 0 0 24 18.33V15.67"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
          </span>
          <span
            data-hint
            role="status"
            class="font-['Geist-Mono'] text-[calc(var(--u)*16)] leading-none tracking-[0.1em] text-[#8a8a8a]"
            >Press Spacebar to test yourself</span
          >
        </div>
        <p
          data-score
          class="mt-[calc(var(--u)*20)] h-[calc(var(--u)*16)] font-['Geist-Mono'] text-[calc(var(--u)*14)] leading-none tracking-[0.1em] whitespace-pre text-[#8a8a8a]"
        ></p>
      </div>
    </main>
    <script type="module" src="/src/notFound/main.js"></script>
  </body>
</html>
